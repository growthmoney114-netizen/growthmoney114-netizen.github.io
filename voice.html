<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="a4084764f54341d86be418878a20ba56">
<title>VocalAI Studio - Free AI Voice Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#070b14;color:#f8fafc;padding-bottom:50px}
header{background:#0f172a;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #10b981}
.logo{font-size:22px;font-weight:900;color:#fff}.logo span{color:#34d399}
.container{max-width:700px;margin:30px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:26px;margin-bottom:8px}.hero p{color:#94a3b8;font-size:14px}
.card{background:#111827;border-radius:12px;padding:22px;border:1px solid #1f2937;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
label{display:block;font-size:13px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
textarea{width:100%;height:130px;padding:14px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:15px;margin-bottom:18px;resize:none;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
select{width:100%;padding:11px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:14px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:10px}
.play{background:#10b981;color:#fff}.stop{background:#1f2937;color:#f87171;border:1px solid #374151}
#box{display:none;margin-top:15px;padding:15px;background:#070b14;border:1px solid #10b981;border-radius:8px;text-align:center}
.dl{display:block;width:100%;padding:14px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;border-radius:8px;border:none;margin-top:10px;cursor:pointer}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px;margin-top:40px}
</style>
</head>
<body>
<header>
  <div class="logo">VocalAI<span>Studio</span></div>
  <span style="color:#34d399;font-size:12px;font-weight:bold">Unlimited Real MP3</span>
</header>
<div class="container">
  <div class="hero">
    <h1>Free AI Text to Speech Converter</h1>
    <p>Convert unlimited scripts into realistic Male or Female voiceovers and download real MP3.</p>
  </div>
  <div class="card">
    <label>Enter Your English Script:</label>
    <textarea id="txt" placeholder="Type or paste English text here..."></textarea>
    <div class="grid">
      <div>
        <label>Voice Character:</label>
        <select id="gen">
          <option value="en-US">👩 Female Voice (US Natural)</option>
          <option value="en-GB">👨 Male Voice (UK Deep)</option>
          <option value="en-AU">👩 Female Voice (Australian)</option>
        </select>
      </div>
      <div>
        <label>Speed:</label>
        <select id="spd">
          <option value="0.85">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.2">Fast</option>
        </select>
      </div>
    </div>
    <button type="button" class="btn play" onclick="go()">▶ Generate & Play AI Voice</button>
    <button type="button" class="btn stop" onclick="speechSynthesis.cancel()">⏹ Stop Voice</button>
    <div id="box">
      <p id="st" style="color:#34d399;font-size:14px;font-weight:bold">🔊 Speaking Now...</p>
      <button type="button" id="dlBtn" class="dl" onclick="downloadRealMp3()">⬇ Download Real MP3 Voice</button>
    </div>
  </div>
</div>
<footer>© 2026 VocalAI Studio</footer>
<script>
  var AD = 'https://' + 'uplcm.com' + '/4/' + '12251489';

  function go() {
    var t = document.getElementById("txt").value.trim();
    if (!t) { alert("Enter text first!"); return; }

    speechSynthesis.cancel();
    var m = new SpeechSynthesisUtterance(t);
    var lang = document.getElementById("gen").value;
    m.lang = lang;
    m.pitch = lang === "en-GB" ? 0.7 : 1.15;
    m.rate = parseFloat(document.getElementById("spd").value);
    
    document.getElementById("box").style.display = "block";
    document.getElementById("st").innerText = "🔊 Speaking Now... Listen clearly!";
    m.onend = function() {
      document.getElementById("st").innerText = "✅ Voice Ready! Click below to download real MP3:";
    };
    speechSynthesis.speak(m);
  }

  async function downloadRealMp3() {
    var t = document.getElementById("txt").value.trim();
    if (!t) { alert("Please enter text first!"); return; }

    var btn = document.getElementById("dlBtn");
    btn.innerText = "⏳ Preparing Real MP3...";
    btn.disabled = true;

    // ১. ক্লিক করার সাথে সাথেই Monetag Direct Link ওপেন হবে
    window.open(AD, "_blank");

    var lang = document.getElementById("gen").value;
    // ফ্রি ওপেন-সোর্স TTS MP3 সার্ভার (SoundOfText API) ব্যবহার করে আসল ভয়েস MP3 তৈরি
    try {
      var createRes = await fetch('https://' + '://soundoftext.com' + '/sounds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ engine: 'Google', data: { text: t.substring(0, 200), voice: lang } })
      });
      var createData = await createRes.json();

      if (createData && createData.id) {
        // অডিও ফাইলটি তৈরি হওয়ার জন্য ১.৫ সেকেন্ড অপেক্ষা
        await new Promise(r => setTimeout(r, 1500));
        var soundUrl = 'https://' + '://soundoftext.com' + '/sounds/' + createData.id;
        var soundRes = await fetch(soundUrl);
        var soundData = await soundRes.json();

        if (soundData && soundData.location) {
          var fileRes = await fetch(soundData.location);
          var blob = await fileRes.blob();
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "VocalAI_" + Date.now() + ".mp3";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      }
    } catch (e) {
      alert("Network busy! Please try clicking Download again.");
    }

    btn.innerText = "⬇ Download Real MP3 Voice";
    btn.disabled = false;
  }
</script>
</body>
</html>
