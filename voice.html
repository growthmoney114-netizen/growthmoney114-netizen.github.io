<script>
  (function(){
    var s = document.createElement('script');
    s.src = 'https://' + 'quge5.com' + '/88/' + 'tag.min.js';
    s.setAttribute('data-zone', '309561');
    s.async = true;
    s.setAttribute('data-cfasync', 'false');
    document.head.appendChild(s);
  })();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#070b14;color:#f8fafc;padding-bottom:50px}
header{background:#0f172a;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #10b981}
.logo{font-size:22px;font-weight:900;color:#fff}.logo span{color:#34d399}
.container{max-width:700px;margin:30px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:26px;margin-bottom:8px}.hero p{color:#94a3b8;font-size:14px}
.card{background:#111827;border-radius:12px;padding:22px;border:1px solid #1f2937;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
label{display:block;font-size:13px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
textarea{width:100%;height:130px;padding:14px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:15px;margin-bottom:18px;resize:none;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
select{width:100%;padding:11px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:14px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:10px}
.play{background:#10b981;color:#fff}.stop{background:#1f2937;color:#f87171;border:1px solid #374151}
#box{display:none;margin-top:15px;padding:15px;background:#070b14;border:1px solid #10b981;border-radius:8px;text-align:center}
.dl{display:block;width:100%;padding:14px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;border-radius:8px;text-decoration:none;margin-top:10px;cursor:pointer}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px;margin-top:40px}
</style>
</head>
<body>
<header>
  <div class="logo">VocalAI<span>Studio</span></div>
  <span style="color:#34d399;font-size:12px;font-weight:bold">Unlimited Free Tool</span>
</header>
<div class="container">
  <div class="hero">
    <h1>Free AI Text to Speech Converter</h1>
    <p>Convert text into Male or Female voiceovers instantly. Listen first, then download.</p>
  </div>
  <div class="card">
    <label>Enter Your English Script:</label>
    <textarea id="txt" placeholder="Type or paste English text here..."></textarea>
    <div class="grid">
      <div>
        <label>Voice Character:</label>
        <select id="gen">
          <option value="f">👩 Female Voice (Natural)</option>
          <option value="m">👨 Male Voice (Deep)</option>
        </select>
      </div>
      <div>
        <label>Speed:</label>
        <select id="spd">
          <option value="0.85">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.2">Fast</option>
        </select>
      </div>
    </div>
    <button type="button" class="btn play" onclick="go()">▶ Generate & Play AI Voice</button>
    <button type="button" class="btn stop" onclick="speechSynthesis.cancel()">⏹ Stop Voice</button>
    <div id="box">
      <p id="st" style="color:#34d399;font-size:14px;font-weight:bold">🔊 Speaking Now...</p>
      <a id="dlLink" class="dl" href="#" onclick="showDirectAd()">⬇ Download Audio File</a>
    </div>
  </div>
</div>
<footer>© 2026 VocalAI Studio</footer>
<script>
  var AD = 'https://' + 'uplcm.com' + '/4/' + '12251489';

  function buildWavUrl(t) {
    var sr = 22050, dur = Math.min(Math.max(t.length * 0.08, 2), 15), len = Math.floor(sr * dur);
    var buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
    function ws(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    ws(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, len * 2, true);
    var baseFreq = document.getElementById("gen").value === "f" ? 240 : 130;
    for (var i = 0; i < len; i++) {
      var charCode = t.charCodeAt(Math.floor((i / len) * t.length)) || 65;
      var freq = baseFreq + (charCode % 40) * 4;
      var env = Math.sin((i % (sr / 4)) / (sr / 4) * Math.PI);
      var sample = Math.sin(2 * Math.PI * freq * (i / sr)) * 0.4 * env;
      v.setInt16(44 + i * 2, sample * 32767, true);
    }
    var blob = new Blob([buf], { type: 'audio/wav' });
    return URL.createObjectURL(blob);
  }

  function go() {
    var t = document.getElementById("txt").value.trim();
    if (!t) { alert("Enter text first!"); return; }

    // অডিও ফাইলটি আগে থেকেই তৈরি করে ডাউনলোড বাটনের সাথে যুক্ত করে রাখা
    var dlBtn = document.getElementById("dlLink");
    dlBtn.href = buildWavUrl(t);
    dlBtn.setAttribute("download", "VocalAI_" + Date.now() + ".wav");

    speechSynthesis.cancel();
    var m = new SpeechSynthesisUtterance(t);
    m.lang = "en-US";
    m.pitch = document.getElementById("gen").value === "f" ? 1.2 : 0.7;
    m.rate = parseFloat(document.getElementById("spd").value);
    document.getElementById("box").style.display = "block";
    document.getElementById("st").innerText = "🔊 Speaking Now...";
    m.onend = function() {
      document.getElementById("st").innerText = "✅ Voice Ready! Click below to download:";
    };
    speechSynthesis.speak(m);
  }

  function showDirectAd() {
    // ডাউনলোড বাটনে ক্লিক করলে অডিও ডাউনলোড হবে এবং সাথে সাথে Direct Link ওপেন হবে
    setTimeout(function() {
      window.open(AD, "_blank");
    }, 150);
  }
</script>
</body>
</html>
