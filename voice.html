<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="a4084764f54341d86be418878a20ba56">
<title>VocalAI Studio - Free AI Voice Generator</title>
<script>
  (function(){
    var s = document.createElement('script');
    s.src = 'https://' + 'quge5.com' + '/88/' + 'tag.min.js';
    s.setAttribute('data-zone', '309561');
    s.async = true;
    s.setAttribute('data-cfasync', 'false');
    document.head.appendChild(s);
  })();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#070b14;color:#f8fafc;padding-bottom:50px}
header{background:#0f172a;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #10b981}
.logo{font-size:22px;font-weight:900;color:#fff}.logo span{color:#34d399}
.container{max-width:700px;margin:30px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:26px;margin-bottom:8px}.hero p{color:#94a3b8;font-size:14px}
.card{background:#111827;border-radius:12px;padding:22px;border:1px solid #1f2937;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
label{display:block;font-size:13px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
textarea{width:100%;height:130px;padding:14px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:15px;margin-bottom:18px;resize:none;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
select{width:100%;padding:11px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:14px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:10px}
.play{background:#10b981;color:#fff}.stop{background:#1f2937;color:#f87171;border:1px solid #374151}
#box{display:none;margin-top:15px;padding:15px;background:#070b14;border:1px solid #10b981;border-radius:8px;text-align:center}
audio{width:100%;margin:10px 0;outline:none}
.dl{display:block;width:100%;padding:14px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;border-radius:8px;border:none;margin-top:8px;cursor:pointer}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px;margin-top:40px}
</style>
</head>
<body>
<header>
  <div class="logo">VocalAI<span>Studio</span></div>
  <span style="color:#34d399;font-size:12px;font-weight:bold">Unlimited Real MP3</span>
</header>
<div class="container">
  <div class="hero">
    <h1>Free AI Text to Speech Converter</h1>
    <p>Convert unlimited scripts into realistic Male or Female voiceovers and download real MP3.</p>
  </div>
  <div class="card">
    <label>Enter Your English Script:</label>
    <textarea id="txt" placeholder="Type or paste English text here..."></textarea>
    <div class="grid">
      <div>
        <label>Voice Character:</label>
        <select id="gen">
          <option value="en-US">👩 Female Voice (US Natural)</option>
          <option value="en-GB">👨 Male Voice (UK Deep)</option>
          <option value="en-AU">👩 Female Voice (Australian)</option>
        </select>
      </div>
      <div>
        <label>Speed:</label>
        <select id="spd">
          <option value="0.85">Slow</option>
          <option value="1" selected>Normal</option>
          <option value="1.2">Fast</option>
        </select>
      </div>
    </div>
    <button type="button" class="btn play" id="genBtn" onclick="createRealVoice()">▶ Generate & Play AI Voice</button>
    <button type="button" class="btn stop" onclick="stopAudio()">⏹ Stop Voice</button>
    <div id="box">
      <p id="st" style="color:#34d399;font-size:14px;font-weight:bold">⏳ Generating Real AI Voice...</p>
      <audio id="player" controls style="display:none"></audio>
      <button type="button" id="dlBtn" class="dl" style="display:none" onclick="saveRealMp3()">⬇ Download MP3 Audio</button>
    </div>
  </div>
</div>
<footer>© 2026 VocalAI Studio</footer>
<script>
  var currentBlob = null;

  async function createRealVoice() {
    var t = document.getElementById("txt").value.trim();
    if (!t) { alert("Please enter some text first!"); return; }

    var box = document.getElementById("box");
    var st = document.getElementById("st");
    var player = document.getElementById("player");
    var dlBtn = document.getElementById("dlBtn");
    var genBtn = document.getElementById("genBtn");

    box.style.display = "block";
    player.style.display = "none";
    dlBtn.style.display = "none";
    st.innerText = "⏳ Generating Real AI Voice...";
    genBtn.disabled = true;

    var lang = document.getElementById("gen").value;
    var rate = parseFloat(document.getElementById("spd").value);

    try {
      var res = await fetch('https://' + 'api.' + 'soundoftext.com' + '/sounds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ engine: 'Google', data: { text: t.substring(0, 200), voice: lang } })
      });
      var data = await res.json();

      if (data && data.id) {
        await new Promise(r => setTimeout(r, 1500));
        var sRes = await fetch('https://' + 'api.' + 'soundoftext.com' + '/sounds/' + data.id);
        var sData = await sRes.json();

        if (sData && sData.location) {
          var audioRes = await fetch(sData.location);
          currentBlob = await audioRes.blob();
          var audioUrl = URL.createObjectURL(currentBlob);

          player.src = audioUrl;
          player.playbackRate = rate;
          player.style.display = "block";
          dlBtn.style.display = "block";
          st.innerText = "✅ Real Voice Ready! Listen or Download below:";
          player.play().catch(function(){});
        }
      }
    } catch (e) {
      st.innerText = "⚠️ Server busy! Please click Generate again.";
    }

    genBtn.disabled = false;
  }

  function stopAudio() {
    var player = document.getElementById("player");
    player.pause();
    player.currentTime = 0;
  }

  function saveRealMp3() {
    if (!currentBlob) return;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(currentBlob);
    a.download = "VocalAI_" + Date.now() + ".mp3";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
