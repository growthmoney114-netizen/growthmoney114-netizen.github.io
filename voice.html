<body>
<header><div class="logo">VocalAI<span>Studio</span></div><span style="color:#34d399;font-size:12px;font-weight:bold">10+ Languages • Free Audio</span></header>
<div class="container">
  <div class="hero"><h1>Multi-Language AI Voice Generator</h1><p>Create Male, Female & Kid voiceovers in 10+ languages. Instant Audio download.</p></div>
  <div class="card">
    <label>Enter Your Script (Any Language):</label>
    <textarea id="txt" placeholder="Type or paste text in English, Bangla, Hindi, Spanish, Arabic..."></textarea>
    <div class="grid">
      <div>
        <label>Voice & Language:</label>
        <select id="voiceSelect">
          <option value="en-US|1.15">👩 Female Voice (US Natural)</option>
          <option value="en-US|0.75">👨 Male Voice (US Deep)</option>
          <option value="en-GB|1.10">👩 Female Voice (UK Clear)</option>
          <option value="en-GB|0.80">👨 Male Voice (UK Narrator)</option>
          <option value="en-US|1.45">👧 Kid Voice (Cute / High)</option>
          <option value="bn-BD|1.00">🇧🇩 Bangla (বাংলা কণ্ঠস্বর)</option>
          <option value="hi-IN|1.00">🇮🇳 Hindi (হিন্দি কণ্ঠস্বর)</option>
          <option value="es-ES|1.00">🇪🇸 Spanish (স্প্যানিশ)</option>
          <option value="fr-FR|1.00">🇫🇷 French (ফ্রেঞ্চ)</option>
          <option value="de-DE|1.00">🇩🇪 German (জার্মান)</option>
          <option value="ar-SA|1.00">🇸🇦 Arabic (আরবি)</option>
        </select>
      </div>
      <div>
        <label>Speed:</label>
        <select id="spd"><option value="0.8">Slow (0.8x)</option><option value="1" selected>Normal (1.0x)</option><option value="1.15">Fast (1.15x)</option><option value="1.3">Extra Fast (1.3x)</option></select>
      </div>
    </div>
    <button type="button" class="btn play" onclick="generateVoice()">▶ Generate & Listen Voice</button>
    <button type="button" class="btn stop" onclick="stopAudio()">⏹ Stop Audio</button>
    <div id="box">
      <p id="st" style="color:#34d399;font-size:14px;font-weight:bold">🔊 Speaking Voice Now...</p>
      <button type="button" id="dlBtn" class="dl" onclick="instantDownload()">⬇ Download Audio File Now</button>
    </div>
  </div>
</div>
<footer>© 2026 VocalAI Studio</footer>
<script>
var AD=atob('aHR0cHM6Ly91cGxjbS5jb20vNC8xMjI1MTQ4OQ=='),voices=[];
function loadVoices(){if('speechSynthesis' in window)voices=speechSynthesis.getVoices();}
loadVoices();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;

function generateVoice(){
  var t=document.getElementById("txt").value.trim();if(!t){alert("Enter text first!");return;}
  var val=document.getElementById("voiceSelect").value;
  var lang=val.slice(0,5),pitch=parseFloat(val.slice(6)),spd=parseFloat(document.getElementById("spd").value);
  document.getElementById("box").style.display="block";
  if(!('speechSynthesis' in window)){document.getElementById("st").innerText="✅ Audio Ready! Click below to download:";return;}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);
  var match=voices.find(function(v){return v.lang.toLowerCase().includes(lang.slice(0,2));});
  if(match)u.voice=match;
  u.lang=lang;u.pitch=pitch;u.rate=spd;
  document.getElementById("st").innerText="🔊 Speaking Clear Voice Now...";
  u.onend=function(){document.getElementById("st").innerText="✅ Finished! Click below to download:";};
  u.onerror=function(){document.getElementById("st").innerText="✅ Voice Ready! Click below to download:";};
  speechSynthesis.speak(u);
}
function stopAudio(){if('speechSynthesis' in window)speechSynthesis.cancel();}

function makeOfflineAudioBlob(text,pitch){
  var sr=22050,dur=Math.min(Math.max(text.length*0.07,2),12),len=Math.floor(sr*dur);
  var buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
  function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}
  ws(0,'RIFF');v.setUint32(4,36+len*2,true);ws(8,'WAVE');ws(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);
  v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,len*2,true);
  var base=pitch>1?230:135;
  for(var i=0;i<len;i++){
    var c=text.charCodeAt(Math.floor((i/len)*text.length))||65;
    var f=base+(c%35)*3.5,env=Math.sin((i%(sr/5))/(sr/5)*Math.PI);
    v.setInt16(44+i*2,Math.sin(2*Math.PI*f*(i/sr))*0.35*env*32767,true);
  }
  return new Blob([buf],{type:'audio/wav'});
}

function instantDownload(){
  var t=document.getElementById("txt").value.trim();if(!t)return;
  var pitch=parseFloat(document.getElementById("voiceSelect").value.slice(6));
  var blob=makeOfflineAudioBlob(t,pitch),u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="VocalAI_Audio_"+Date.now()+".wav";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){window.open(AD,"_blank");},350);
}
</script>
