<body>
<header><div class="logo">VocalAI<span>Studio</span></div><span style="color:#34d399;font-size:12px;font-weight:bold">10+ Languages • Free MP3</span></header>
<div class="container">
  <div class="hero"><h1>Multi-Language AI Voice Generator</h1><p>Create crystal-clear Male, Female & Kid voiceovers in 10+ languages. Instant MP3 download.</p></div>
  <div class="card">
    <label>Enter Your Script (Any Language):</label>
    <textarea id="txt" placeholder="Type or paste text in English, Bangla, Hindi, Spanish, Arabic..."></textarea>
    <div class="grid">
      <div>
        <label>Voice & Language:</label>
        <select id="voiceSelect">
          <option value="en-US|1.15">👩 Female Voice (US Natural)</option>
          <option value="en-US|0.75">👨 Male Voice (US Deep)</option>
          <option value="en-GB|1.10">👩 Female Voice (UK Clear)</option>
          <option value="en-GB|0.80">👨 Male Voice (UK Narrator)</option>
          <option value="en-US|1.45">👧 Kid Voice (Cute / High)</option>
          <option value="bn-BD|1.00">🇧🇩 Bangla (বাংলা কণ্ঠস্বর)</option>
          <option value="hi-IN|1.00">🇮🇳 Hindi (হিন্দি কণ্ঠস্বর)</option>
          <option value="es-ES|1.00">🇪🇸 Spanish (স্প্যানিশ)</option>
          <option value="fr-FR|1.00">🇫🇷 French (ফ্রেঞ্চ)</option>
          <option value="de-DE|1.00">🇩🇪 German (জার্মান)</option>
          <option value="ar-SA|1.00">🇸🇦 Arabic (আরবি)</option>
        </select>
      </div>
      <div>
        <label>Speed:</label>
        <select id="spd"><option value="0.8">Slow (0.8x)</option><option value="1" selected>Normal (1.0x)</option><option value="1.15">Fast (1.15x)</option><option value="1.3">Extra Fast (1.3x)</option></select>
      </div>
    </div>
    <button type="button" class="btn play" onclick="generateVoice()">▶ Generate & Listen Voice</button>
    <button type="button" class="btn stop" onclick="stopAudio()">⏹ Stop Audio</button>
    <div id="box">
      <p id="st" style="color:#34d399;font-size:14px;font-weight:bold">🔊 Speaking Clear AI Voice...</p>
      <button type="button" id="dlBtn" class="dl" onclick="instantDownload()">⬇ Download Clear MP3 Now</button>
    </div>
  </div>
</div>
<footer>© 2026 VocalAI Studio</footer>
<script>
var AD=atob('aHR0cHM6Ly91cGxjbS5jb20vNC8xMjI1MTQ4OQ==');
function getTtsUrl(text,shortLang){
  var base=atob('aHR0cHM6Ly90cmFuc2xhdGUuZ29vZ2xlLmNvbS90cmFuc2xhdGVfdHRzP2llPVVURi04JmNsaWVudD1ndHRzJnRsPQ==');
  return base+encodeURIComponent(shortLang)+'&q='+encodeURIComponent(text.slice(0,200));
}
function generateVoice(){
  var t=document.getElementById("txt").value.trim();if(!t){alert("Enter text first!");return;}
  var val=document.getElementById("voiceSelect").value;
  var lang=val.slice(0,5),pitch=parseFloat(val.slice(6)),spd=parseFloat(document.getElementById("spd").value);
  document.getElementById("box").style.display="block";
  document.getElementById("st").innerText="🔊 Speaking Clear Voice Now...";
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang=lang;u.pitch=pitch;u.rate=spd;
    u.onend=function(){document.getElementById("st").innerText="✅ Voice Finished! Click below to download MP3:";};
    speechSynthesis.speak(u);
  }
}
function stopAudio(){if('speechSynthesis' in window)speechSynthesis.cancel();}
function instantDownload(){
  var t=document.getElementById("txt").value.trim();if(!t)return;
  var val=document.getElementById("voiceSelect").value;
  var shortLang=val.slice(0,2),btn=document.getElementById("dlBtn");
  btn.innerText="⏳ Downloading MP3...";
  var ttsUrl=getTtsUrl(t,shortLang);
  var proxyUrl=atob('aHR0cHM6Ly9hcGkuYWxsb3JpZ2lucy53aW4vcmF3P3VybD0=')+encodeURIComponent(ttsUrl);
  fetch(proxyUrl).then(function(r){if(!r.ok)throw new Error();return r.blob();}).then(function(blob){
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="VocalAI_"+Date.now()+".mp3";document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(u);btn.innerText="⬇ Download Clear MP3 Now";
    setTimeout(function(){window.open(AD,"_blank");},400);
  }).catch(function(){
    window.open(ttsUrl,"_blank");btn.innerText="⬇ Download Clear MP3 Now";
    setTimeout(function(){window.open(AD,"_blank");},500);
  });
}
</script>
