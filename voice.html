<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="monetag" content="a4084764f54341d86be418878a20ba56">
<title>VocalAI Studio - Free AI Voice Generator</title>
<script>
  (function(){
    var s = document.createElement('script');
    s.src = 'https://' + 'quge5.com' + '/88/' + 'tag.min.js';
    s.setAttribute('data-zone', '309561');
    s.async = true;
    s.setAttribute('data-cfasync', 'false');
    document.head.appendChild(s);
  })();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#070b14;color:#f8fafc;padding-bottom:50px}
header{background:#0f172a;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #10b981}
.logo{font-size:22px;font-weight:900;color:#fff}.logo span{color:#34d399}
.container{max-width:700px;margin:30px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:26px;margin-bottom:8px}.hero p{color:#94a3b8;font-size:14px}
.card{background:#111827;border-radius:12px;padding:22px;border:1px solid #1f2937;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
label{display:block;font-size:13px;font-weight:600;color:#cbd5e1;margin-bottom:6px}
textarea{width:100%;height:130px;padding:14px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:15px;margin-bottom:18px;resize:none;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
select{width:100%;padding:11px;background:#070b14;border:1px solid #374151;color:#fff;border-radius:8px;font-size:14px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:10px}
.play{background:#10b981;color:#fff}.stop{background:#1f2937;color:#f87171;border:1px solid #374151}
#box{display:none;margin-top:15px;padding:15px;background:#070b14;border:1px solid #10b981;border-radius:8px;text-align:center}
audio{width:100%;margin-top:12px;border-radius:8px}
.dl{display:block;width:100%;padding:14px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;border-radius:8px;border:none;margin-top:12px;cursor:pointer}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px;margin-top:40px}
</style>
</head>
<body>
<header>
  <div class="logo">VocalAI<span>Studio</span></div>
  <span style="color:#34d399;font-size:12px;font-weight:bold">Unlimited Free Tool</span>
</header>
<div class="container">
  <div class="hero">
    <h1>Free AI Text to Speech Converter</h1>
    <p>Convert English text into realistic Male or Female voiceovers. Play & download MP3 free.</p>
  </div>
  <div class="card">
    <label>Enter Your English Script:</label>
    <textarea id="txt" placeholder="Type or paste English text here..."></textarea>
    <div class="grid">
      <div>
        <label>Voice Character:</label>
        <select id="gen">
          <option value="Amy">👩 Amy - Female (Natural UK)</option>
          <option value="Joanna">👩 Joanna - Female (US)</option>
          <option value="Brian">👨 Brian - Male (Deep UK)</option>
          <option value="Matthew">👨 Matthew - Male (US)</option>
        </select>
      </div>
      <div>
        <label>Speed:</label>
        <select id="spd">
          <option value="0.85">Slow (0.85x)</option>
          <option value="1" selected>Normal (1.0x)</option>
          <option value="1.2">Fast (1.2x)</option>
        </select>
      </div>
    </div>
    <button type="button" class="btn play" onclick="go()">▶ Generate AI Voice</button>
    <button type="button" class="btn stop" onclick="stopAudio()">⏹ Stop Voice</button>
    <div id="box">
      <p id="st" style="color:#34d399;font-size:14px;font-weight:bold">⏳ Generating Realistic Voice...</p>
      <audio id="player" controls></audio>
      <button type="button" id="dlBtn" class="dl" onclick="downloadRealMp3()">⬇ Download Real MP3 File</button>
    </div>
  </div>
</div>
<footer>© 2026 VocalAI Studio</footer>
<script>
  var AD = 'https://' + 'uplcm.com' + '/4/' + '12251489';
  var currentAudioUrl = "";

  function go() {
    var t = document.getElementById("txt").value.trim();
    if (!t) { alert("Enter text first!"); return; }

    var voice = document.getElementById("gen").value;
    var speed = parseFloat(document.getElementById("spd").value);
    var player = document.getElementById("player");

    document.getElementById("box").style.display = "block";
    document.getElementById("st").innerText = "🔊 Playing Realistic AI Voice...";

    currentAudioUrl = "https://streamelements.com" + encodeURIComponent(voice) + "&text=" + encodeURIComponent(t);
    player.src = currentAudioUrl;
    player.playbackRate = speed;
    player.play().catch(function() {
      document.getElementById("st").innerText = "✅ Voice Ready! Press Play or Download below:";
    });

    player.onended = function() {
      document.getElementById("st").innerText = "✅ Voice Finished! Click below to download MP3:";
    };
  }

  function stopAudio() {
    var player = document.getElementById("player");
    player.pause();
    player.currentTime = 0;
  }

  function downloadRealMp3() {
    if (!currentAudioUrl) return;
    var btn = document.getElementById("dlBtn");
    btn.innerText = "⏳ Downloading MP3...";

    // Monetag Direct Link ওপেন হবে
    window.open(AD, "_blank");

    // আসল MP3 ফাইলটি Blob হিসেবে ফোনে সেভ করা
    fetch(currentAudioUrl)
      .then(function(res) { return res.blob(); })
      .then(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "VocalAI_" + Date.now() + ".mp3";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        btn.innerText = "⬇ Download Real MP3 File";
      })
      .catch(function() {
        // ব্যাকআপ হিসেবে সরাসরি অডিও লিংক ওপেন করা
        window.location.href = currentAudioUrl;
        btn.innerText = "⬇ Download Real MP3 File";
      });
  }
</script>
</body>
</html>
