<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#090d16;color:#fff;padding-bottom:50px}
header{background:#0f172a;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #3b82f6}
.logo{font-size:22px;font-weight:900}.logo span{color:#3b82f6}
.container{max-width:650px;margin:40px auto;padding:0 20px;text-align:center}
h1{font-size:28px;margin-bottom:10px}p{color:#94a3b8;font-size:15px;margin-bottom:25px}
.box{background:#1e293b;padding:25px;border-radius:12px;border:1px solid #334155;box-shadow:0 10px 25px rgba(0,0,0,0.4)}
input{width:100%;padding:15px;background:#090d16;border:1px solid #475569;color:#fff;border-radius:8px;font-size:15px;margin-bottom:15px;outline:none}
.btn{width:100%;padding:15px;background:#3b82f6;border:none;color:#fff;font-weight:800;border-radius:8px;font-size:16px;cursor:pointer;transition:0.2s}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.badges span{background:#0f172a;color:#93c5fd;padding:5px 10px;border-radius:6px;font-size:12px;border:1px solid #334155}
</style>
</head>
<body>
<header><div class="logo">QuickSave<span>Pro</span></div><span style="color:#60a5fa;font-size:12px;font-weight:bold">No Watermark HD</span></header>
<div class="container">
<h1>Download HD Videos Without Watermark</h1>
<p>Paste any TikTok, Instagram Reels, YouTube Shorts, or Twitter video link below.</p>
<div class="box">
<input type="text" id="vUrl" placeholder="Paste video link here (https://...)">
<button type="button" id="dlBtn" class="btn" onclick="processDownload()">⬇ Download HD Video</button>
<div class="badges">
  <span>✅ TikTok HD</span>
  <span>✅ Instagram Reels</span>
  <span>✅ YouTube & Shorts</span>
  <span>✅ X / Twitter</span>
</div>
</div>
</div>
<script>
  var AD = atob('aHR0cHM6Ly91cGxjbS5jb20vNC8xMjI1MTQ4OQ==');
  var COBALT = atob('aHR0cHM6Ly9jb2JhbHQudG9vbHM=');
  var YT_TOOL = atob('aHR0cHM6Ly95Mm1hdGUubG9sL2VuMTc4Lw==');
  var step = 0;

  function processDownload() {
    var u = document.getElementById("vUrl").value.trim();
    if (!u) { alert("Please paste a video link first!"); return; }
    var btn = document.getElementById("dlBtn");

    if (step === 0) {
      step = 1;
      navigator.clipboard.writeText(u).catch(function(){});
      btn.innerText = "✅ Link Verified! Click Again to Save Video";
      btn.style.background = "#16a34a";
      window.open(AD, "_blank");
    } else {
      step = 0;
      btn.innerText = "⬇ Download HD Video";
      btn.style.background = "#3b82f6";
      var lower = u.toLowerCase();
      if (lower.includes("youtube.com") || lower.includes("youtu.be")) {
        window.open(YT_TOOL, "_blank");
      } else {
        window.open(COBALT, "_blank");
      }
    }
  }
</script>
</body>
