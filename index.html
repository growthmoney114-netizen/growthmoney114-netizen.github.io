<script>
  var AD = 'https://' + 'uplcm.com' + '/4/' + '12251489';
  var TOOL = 'https://' + 'cobalt' + '.tools';

  function processDownload() {
    var u = document.getElementById("vUrl").value.trim();

    var btn = document.getElementById("dlBtn");

    if (step === 0) {
